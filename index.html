<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOMENA SERVICE - GESTION</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1e1e1e; color: #f0f0f0; margin: 0; padding: 10px; }
    header { text-align: center; margin-bottom: 10px; }
    .container { display: flex; gap: 10px; height: 90vh; }
    .form-column { width: 300px; background: #2a2a2a; padding: 10px; border-radius: 8px; overflow-y: auto; }
    .list-column { flex: 1; background: #2a2a2a; padding: 10px; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .btn-scan { background: #e91e63; color: white; width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    .form-group { margin-bottom: 8px; }
    label { display: block; font-size: 0.7em; color: #aaa; text-transform: uppercase; }
    input { width: 100%; padding: 5px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; }
    .table-wrapper { flex: 1; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8em; }
    th, td { border: 1px solid #444; padding: 6px; text-align: left; }
    th { background: #333; position: sticky; top: 0; }
    .btn-action { padding: 4px 8px; cursor: pointer; border: none; border-radius: 3px; margin-right: 2px; }
  </style>
</head>
<body>

  <header><h1>NOMENA SERVICE</h1></header>

  <div class="container">
    <div class="form-column">
      <h2>SAISIE COLIS</h2>
      <button class="btn-scan" onclick="openCamera()">📷 SCANNER FEUILLE</button>
      <form id="colisForm">
        <input type="hidden" id="editIndex" value="-1">
        <div class="form-group"><label>N° BC (AR)</label><input type="text" id="noBordereau" required></div>
        <div class="form-group"><label>N° COLIS (CO)</label><input type="text" id="noColis" required></div>
        <div class="form-group"><label>EXP / DEST</label><div style="display:flex; gap:5px;"><input type="text" id="exp"><input type="text" id="dest"></div></div>
        <div class="form-group"><label>CLIENT EXP / DEST</label><input type="text" id="clientExp"><input type="text" id="clientDest"></div>
        <div class="form-group"><label>DATE ARRIVÉE</label><input type="date" id="dateArrivee"></div>
        <div class="form-group"><label>CHAUFFEUR / VÉHICULE</label><div style="display:flex; gap:5px;"><input type="text" id="chauffeur"><input type="text" id="vehicule"></div></div>
        <div class="form-group"><input type="checkbox" id="isLivre"> <label style="display:inline;" for="isLivre">LIVRÉ ?</label></div>
        <div id="livraisonFormFields">
            <div class="form-group"><label>LIVREUR</label><input type="text" id="monLivreur"></div>
            <div class="form-group"><label>MONTANT / PAIEMENT</label><div style="display:flex; gap:5px;"><input type="number" id="montant"><input type="text" id="modePaiement"></div></div>
        </div>
        <button type="submit" style="width:100%; padding:10px; background:green; color:white; border:none;">ENREGISTRER</button>
      </form>
    </div>

    <div class="list-column">
      <div class="table-wrapper">
        <table>
          <thead><tr><th>BC</th><th>COLIS</th><th>EXP</th><th>DEST</th><th>ACTIONS</th></tr></thead>
          <tbody id="colisList"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="cameraModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black;">
    <video id="cameraVideo" style="width:100%; height:80%; object-fit:contain;" autoplay playsinline></video>
    <button style="width:100%; padding:20px; font-size:1.5em; background:green;" onclick="capturePhoto()">CAPTURER</button>
  </div>

  <script>
    const sb = supabase.createClient("https://putlhepzxfmeqodgruyt.supabase.co", "sb_publishable_bZHu3Rz9HgwvHMt2w__gEg_QhB9ecJd");
    let colisList = JSON.parse(localStorage.getItem("colis_data")) || [];

    function openCamera() {
      document.getElementById('cameraModal').style.display = 'block';
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(s => document.getElementById('cameraVideo').srcObject = s);
    }

    async function capturePhoto() {
      const video = document.getElementById('cameraVideo');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const data = canvas.toDataURL('image/jpeg', 0.85);
      document.getElementById('cameraModal').style.display = 'none';
      
      // Envoi OCR
      const fd = new FormData(); fd.append('base64Image', data); fd.append('apikey', 'helloworld'); fd.append('language', 'fre');
      const res = await fetch('https://api.ocr.space/parse/image', { method: 'POST', body: fd });
      const json = await res.json();
      processOCR(json.ParsedResults[0].ParsedText);
    }

    function processOCR(text) {
      const words = text.split(/[\s\n]+/).filter(w => w.length > 8);
      const arCodes = words.filter(w => w.startsWith("AR"));
      const coCodes = words.filter(w => w.startsWith("CO"));
      
      const total = Math.min(arCodes.length, coCodes.length);
      for(let i=0; i<total; i++) {
        colisList.unshift({ noBordereau: arCodes[i], noColis: coCodes[i], dateArrivee: new Date().toISOString().slice(0,10) });
      }
      localStorage.setItem("colis_data", JSON.stringify(colisList));
      renderList();
    }

    function renderList() {
      const tbody = document.getElementById("colisList");
      tbody.innerHTML = colisList.map((c, i) => `<tr><td>${c.noBordereau}</td><td>${c.noColis}</td><td>${c.exp||''}</td><td>${c.dest||''}</td><td><button onclick="edit(${i})">Edit</button></td></tr>`).join('');
    }

    document.getElementById("colisForm").onsubmit = (e) => {
      e.preventDefault();
      // Sauvegarde logique ici...
      renderList();
    };

    renderList();
  </script>
</body>
</html>
