<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOMENA - SAISIE RAPIDE</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eee; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 2px 5px #ccc; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 18px; }
        button { width: 100%; padding: 20px; background: #27ae60; color: white; border: none; font-size: 18px; border-radius: 5px; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Saisie Colis</h2>
        <input type="text" id="bc" placeholder="Entrer N° AR...">
        <input type="text" id="co" placeholder="Entrer N° CO...">
        <button onclick="enregistrer()">ENREGISTRER</button>
        <button onclick="sauvegarderJSON()" style="background:#2980b9; margin-top:10px;">💾 EXPORTER JSON</button>
    </div>
    
    <table id="tableau">
        <thead><tr><th>BC / COLIS</th><th>ACTION</th></tr></thead>
        <tbody id="corps"></tbody>
    </table>

    <script>
        let liste = JSON.parse(localStorage.getItem('colis_db')) || [];
        
        function enregistrer() {
            let bc = document.getElementById('bc').value;
            let co = document.getElementById('co').value;
            if(bc && co) {
                liste.push({bc, co});
                localStorage.setItem('colis_db', JSON.stringify(liste));
                document.getElementById('bc').value = '';
                document.getElementById('co').value = '';
                afficher();
            }
        }
        
        function afficher() {
            let html = "";
            liste.forEach((c, i) => {
                html += `<tr><td>${c.bc}<br>${c.co}</td><td><button onclick="supprimer(${i})">X</button></td></tr>`;
            });
            document.getElementById('corps').innerHTML = html;
        }

        function supprimer(i) { liste.splice(i, 1); localStorage.setItem('colis_db', JSON.stringify(liste)); afficher(); }
        
        function sauvegarderJSON() {
            let data = JSON.stringify(liste);
            let blob = new Blob([data], {type: "application/json"});
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url; a.download = "colis_nomena.json"; a.click();
        }
        afficher();
    </script>
</body>
</html>
