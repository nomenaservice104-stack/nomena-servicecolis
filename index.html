<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOMENA SERVICE - ULTRA SIMPLE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1e1e1e; color: #f0f0f0; margin: 0; padding: 10px; }
    header { text-align: center; margin-bottom: 10px; }
    header h1 { margin: 0; color: #4fc3f7; font-size: 1.4em; text-transform: uppercase; }
    
    .btn-scan { background: #e91e63; font-size: 1em; padding: 12px; font-weight: bold; width: 100%; border-radius: 4px; border: none; color: white; cursor: pointer; text-transform: uppercase; margin-bottom: 15px; }
    
    .container { display: flex; gap: 10px; height: calc(100vh - 120px); }
    .form-column { flex: 0 0 280px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 10px; overflow-y: auto; }
    .list-column { flex: 1; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; }
    
    label { display: block; margin-top: 8px; text-transform: uppercase; font-size: 0.75em; color: #aaa; }
    input, select { width: 100%; padding: 6px; border: 1px solid #555; border-radius: 4px; background: #222; color: #f0f0f0; font-size: 0.85em; margin-top: 2px; }
    button[type="submit"] { width: 100%; padding: 8px; background: #3a9d23; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em; text-transform: uppercase; margin-top: 12px; }
    
    .table-wrapper { flex: 1; overflow: auto; border: 1px solid #444; border-radius: 4px; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
    th, td { padding: 6px; border: 1px solid #444; text-align: left; text-transform: uppercase; }
    th { background: #333; color: #ddd; position: sticky; top: 0; }
    tr:nth-child(even) { background: #262626; }
    .no-colis { color: #4fc3f7; font-weight: bold; }
    
    /* MODAL CAMERA */
    #cameraModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 2000; }
    #cameraModal.active { display: block; }
    #cameraVideo { width: 100%; height: 100%; object-fit: cover; }
    .btn-capture-floating { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2e7d32; color: white; border: 3px solid white; border-radius: 50px; padding: 16px 32px; font-size: 1.1em; font-weight: bold; text-transform: uppercase; cursor: pointer; }
    .btn-close-floating { position: absolute; top: 20px; right: 20px; background: #d32f2f; color: white; border-radius: 6px; padding: 10px 16px; font-weight: bold; cursor: pointer; border: none; }
    
    .ocr-loading { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); color: #fff; padding: 20px; border-radius: 10px; z-index: 3001; text-align: center; border: 1px solid #e91e63; }
    .ocr-loading.active { display: block; }
    .ocr-loading .spin { display: inline-block; width: 30px; height: 30px; border: 4px solid #f3f3f3; border-top: 4px solid #e91e63; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header><h1>NOMENA SERVICE</h1></header>

  <div class="container">
    <div class="form-column">
      <button type="button" class="btn-scan" onclick="openCamera()">📷 SCANNER LA FEUILLE</button>
      
      <form id="colisForm">
        <input type="hidden" id="editIndex" value="-1">
        <label>N° COLIS (CO)</label>
        <input type="text" id="noColis" required>
        
        <label>N° BORDEREAU (AR)</label>
        <input type="text" id="noBordereau" required>
        
        <label>STATUT</label>
        <select id="statutLivraison">
          <option value="Reçu">Reçu</option>
          <option value="En cours">En cours</option>
          <option value="Livré">Livré</option>
        </select>
        
        <button type="submit">Enregistrer</button>
      </form>
    </div>

    <div class="list-column">
      <h3 style="margin: 0; font-size: 1em; text-transform: uppercase; color: #4fc3f7;">Liste des Colis</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>N° COLIS</th>
              <th>N° BORDEREAU</th>
              <th>STATUT</th>
              <th>ACTIONS</th>
            </tr>
          </thead>
          <tbody id="colisList"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="cameraModal">
    <video id="cameraVideo" autoplay playsinline></video>
    <canvas id="cameraCanvas" style="display:none;"></canvas>
    <button type="button" class="btn-capture-floating" onclick="capturePhoto()">📷 CAPTURER ET LIRE LES CODES</button>
    <button type="button" class="btn-close-floating" onclick="closeCamera()">X</button>
  </div>

  <div id="ocrLoading" class="ocr-loading">
    <div class="spin"></div>
    <p>Extraction unique des N° BC et N° COLIS...</p>
  </div>

  <script>
    const supabaseUrl = "https://putlhepzxfmeqodgruyt.supabase.co";
    const supabaseKey = "sb_publishable_bZHu3Rz9HgwvHMt2w__gEg_QhB9ecJd";
    const { createClient } = supabase;
    const sb = createClient(supabaseUrl, supabaseKey);

    const OCRSPACE_API_KEY = "helloworld"; 

    let localColis = JSON.parse(localStorage.getItem("colis_simple")) || [];
    let videoStream = null;

    function renderList() {
      const tbody = document.getElementById("colisList");
      tbody.innerHTML = "";
      
      if (localColis.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#aaa;">Aucun colis. Scannez une feuille.</td></tr>`;
        return;
      }

      localColis.forEach((c, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="no-colis">${c.noColis}</span></td>
          <td>${c.noBordereau}</td>
          <td>${c.statutLivraison}</td>
          <td>
            <button onclick="editColis(${index})" style="background:#ef6c00; color:white; border:none; padding:3px 6px; border-radius:3px; cursor:pointer;">Éditer</button>
            <button onclick="deleteColis(${index})" style="background:#c62828; color:white; border:none; padding:3px 6px; border-radius:3px; cursor:pointer;">Suppr</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openCamera() {
      document.getElementById('cameraModal').classList.add('active');
      navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
      }).then(stream => {
        videoStream = stream;
        document.getElementById('cameraVideo').srcObject = stream;
      }).catch(err => { alert('Erreur caméra: ' + err.message); closeCamera(); });
    }

    function capturePhoto() {
      const video = document.getElementById('cameraVideo');
      const canvas = document.getElementById('cameraCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64 = canvas.toDataURL('image/jpeg', 0.9);
      closeCamera();
      sendToOCR(base64);
    }

    function closeCamera() {
      document.getElementById('cameraModal').classList.remove('active');
      if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
    }

    async function sendToOCR(base64Data) {
      document.getElementById('ocrLoading').classList.add('active');
      try {
        const formData = new FormData();
        formData.append('base64Image', base64Data);
        formData.append('apikey', OCRSPACE_API_KEY);
        formData.append('language', 'fre');
        formData.append('OCREngine', '2');

        const res = await fetch('https://api.ocr.space/parse/image', { method: 'POST', body: formData });
        const json = await res.json();

        if (!json.ParsedResults || json.ParsedResults.length === 0) throw new Error("Impossible de lire l'image.");

        const fullText = json.ParsedResults[0].ParsedText;
        const count = extractOnlyCodes(fullText);

        document.getElementById('ocrLoading').classList.remove('active');
        if (count > 0) alert(`✔ Réussi ! ${count} colis enregistrés.`);
        else alert("Aucun code trouvé. Assurez-vous que les codes CO et AR soient bien visibles et droits.");
      } catch (err) {
        document.getElementById('ocrLoading').classList.remove('active');
        alert("Erreur de scan : " + err.message);
      }
    }

    // === RECHERCHE BRUTE ET ASSOCIEE DES CODES CO ET AR ===
    function extractOnlyCodes(text) {
      const words = text.split(/[\s,;\n\r]+/).map(w => w.trim().toUpperCase());
      
      // On isole tous les mots qui contiennent CO ou AR
      let listCO = words.filter(w => w.includes("CO") && w.length >= 8);
      let listAR = words.filter(w => w.includes("AR") && w.length >= 8);

      let inserted = 0;

      // On crée une entrée pour chaque numéro de colis trouvé
      listCO.forEach((coCode, index) => {
        // On prend le BC correspondant dans la liste, ou la racine par défaut si absent
        let bcCode = listAR[index] || "AR2605RA";

        const item = {
          noColis: coCode,
          noBordereau: bcCode,
          statutLivraison: "Reçu"
        };

        localColis.unshift(item);
        inserted++;

        // Envoi direct vers ta table Supabase
        syncWithSupabase(item).then(saved => { if (saved) { item.id = saved.id; localStorage.setItem("colis_simple", JSON.stringify(localColis)); } });
      });

      if (inserted > 0) {
        localStorage.setItem("colis_simple", JSON.stringify(localColis));
        renderList();
      }
      return inserted;
    }

    async function syncWithSupabase(item) {
      const payload = {
        no_colis: item.noColis,
        no_bordereau: item.noBordereau,
        statut_livraison: item.statutLivraison
      };
      try {
        if (item.id) {
          const { data, error } = await sb.from("colis").update(payload).eq("id", item.id).select().single();
          if (error) throw error; return data;
        } else {
          const { data, error } = await sb.from("colis").insert(payload).select().single();
          if (error) throw error; return data;
        }
      } catch (e) { console.error("Erreur Supabase:", e); return null; }
    }

    // FORMULAIRE MANUEL
    document.getElementById("colisForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const idx = parseInt(document.getElementById("editIndex").value);
      
      const item = {
        id: idx >= 0 ? localColis[idx].id : undefined,
        noColis: document.getElementById("noColis").value.trim().toUpperCase(),
        noBordereau: document.getElementById("noBordereau").value.trim().toUpperCase(),
        statutLivraison: document.getElementById("statutLivraison").value
      };

      if (idx >= 0) localColis[idx] = item; else localColis.unshift(item);
      localStorage.setItem("colis_simple", JSON.stringify(localColis));

      const saved = await syncWithSupabase(item);
      if (saved && idx < 0) localColis[0].id = saved.id;
      localStorage.setItem("colis_simple", JSON.stringify(localColis));

      document.getElementById("editIndex").value = "-1";
      this.reset();
      renderList();
    });

    function editColis(idx) {
      document.getElementById("editIndex").value = idx;
      document.getElementById("noColis").value = localColis[idx].noColis;
      document.getElementById("noBordereau").value = localColis[idx].noBordereau;
      document.getElementById("statutLivraison").value = localColis[idx].statutLivraison;
    }

    function deleteColis(idx) {
      if (!confirm("Supprimer ce colis ?")) return;
      if (localColis[idx].id) sb.from("colis").delete().eq("id", localColis[idx].id);
      localColis.splice(idx, 1);
      localStorage.setItem("colis_simple", JSON.stringify(localColis));
      renderList();
    }

    window.addEventListener("DOMContentLoaded", renderList);
  </script>
</body>
</html>
