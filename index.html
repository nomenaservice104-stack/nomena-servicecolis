<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>NOMENA - GESTION COLIS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; display: flex; height: 100vh; margin: 0; }
        .side-panel { width: 350px; background: #1e1e1e; padding: 20px; border-right: 1px solid #333; overflow-y: auto; }
        .main-panel { flex: 1; padding: 20px; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8em; color: #888; }
        input { width: 100%; padding: 8px; background: #333; border: 1px solid #444; color: white; border-radius: 4px; }
        button { cursor: pointer; border: none; padding: 10px; border-radius: 4px; font-weight: bold; width: 100%; margin-top: 5px; }
        .btn-save { background: #4caf50; color: white; }
        .btn-scan { background: #e91e63; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; font-size: 0.9em; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7em; }
        .bg-ok { background: #2e7d32; }
        .bg-wait { background: #d84315; }
    </style>
</head>
<body>

<div class="side-panel">
    <h2>POSTE DE SAISIE</h2>
    <button class="btn-scan" onclick="alert('Fonction Scan activée')">📷 SCANNER (AR+CO)</button>
    <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">
    <form id="colisForm">
        <input type="hidden" id="editIdx" value="-1">
        <div class="form-group"><label>N° BC (AR)</label><input type="text" id="bc" required></div>
        <div class="form-group"><label>N° COLIS (CO)</label><input type="text" id="co" required></div>
        <div class="form-group"><label>CLIENT / DEST</label><input type="text" id="client"></div>
        <div class="form-group"><label>LIVREUR</label><input type="text" id="livreur"></div>
        <div class="form-group"><label>MONTANT</label><input type="number" id="montant"></div>
        <div class="form-group"><input type="checkbox" id="isLivre"> <label style="display:inline;">COLIS LIVRÉ ?</label></div>
        <button type="submit" class="btn-save">ENREGISTRER</button>
        <button type="button" onclick="resetForm()">VIDER</button>
    </form>
</div>

<div class="main-panel">
    <h2>TOUR DE CONTRÔLE</h2>
    <button onclick="exportJSON()">💾 SAUVEGARDER (JSON)</button>
    <table>
        <thead><tr><th>AR / CO</th><th>CLIENT</th><th>LIVREUR</th><th>MONTANT</th><th>STATUT</th><th>ACTIONS</th></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    let list = JSON.parse(localStorage.getItem('colis_data')) || [];

    function render() {
        const body = document.getElementById('tableBody');
        body.innerHTML = list.map((c, i) => `<tr>
            <td>${c.bc}<br><small>${c.co}</small></td>
            <td>${c.client || '-'}</td>
            <td>${c.livreur || '-'}</td>
            <td>${c.montant || '0'} Ar</td>
            <td><span class="badge ${c.livre ? 'bg-ok' : 'bg-wait'}">${c.livre ? 'LIVRÉ' : 'EN ATTENTE'}</span></td>
            <td><button onclick="edit(${i})">ÉDITER</button></td>
        </tr>`).join('');
    }

    document.getElementById('colisForm').onsubmit = (e) => {
        e.preventDefault();
        const idx = document.getElementById('editIdx').value;
        const data = {
            bc: document.getElementById('bc').value,
            co: document.getElementById('co').value,
            client: document.getElementById('client').value,
            livreur: document.getElementById('livreur').value,
            montant: document.getElementById('montant').value,
            livre: document.getElementById('isLivre').checked
        };
        
        if (idx == -1) list.unshift(data);
        else list[idx] = data;
        
        localStorage.setItem('colis_data', JSON.stringify(list));
        resetForm();
        render();
    };

    function resetForm() {
        document.getElementById('colisForm').reset();
        document.getElementById('editIdx').value = "-1";
    }

    function edit(i) {
        const c = list[i];
        document.getElementById('bc').value = c.bc;
        document.getElementById('co').value = c.co;
        document.getElementById('client').value = c.client;
        document.getElementById('livreur').value = c.livreur;
        document.getElementById('montant').value = c.montant;
        document.getElementById('isLivre').checked = c.livre;
        document.getElementById('editIdx').value = i;
    }

    function exportJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(list));
        const dl = document.createElement('a');
        dl.setAttribute("href", dataStr);
        dl.setAttribute("download", "sauvegarde_nomena.json");
        dl.click();
    }

    render();
</script>
</body>
</html>
