<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>NOMENA - SCAN RÉEL</title>
    <!-- Moteur de scan intégré -->
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
        .form-container { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; }
        input { width: 90%; padding: 10px; margin: 5px 0; background: #333; border: 1px solid #444; color: white; }
        button { width: 100%; padding: 15px; background: #e91e63; color: white; border: none; font-weight: bold; cursor: pointer; }
        #status { color: #f44336; margin-top: 10px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>SCANNER UN COLIS</h2>
    <!-- Le bouton ouvre l'appareil photo -->
    <input type="file" id="camera" accept="image/*" capture="environment" style="display:none">
    <button onclick="document.getElementById('camera').click()">📷 SCANNER AR+CO</button>
    <p id="status">Prêt à scanner...</p>

    <div style="margin-top:20px;">
        <label>N° BC (AR)</label><input type="text" id="bc">
        <label>N° COLIS (CO)</label><input type="text" id="co">
    </div>
</div>

<script>
    document.getElementById('camera').addEventListener('change', async (e) => {
        const status = document.getElementById('status');
        status.innerText = "Lecture en cours... patiente...";
        
        const file = e.target.files[0];
        
        // Lancer la lecture OCR
        Tesseract.recognize(file, 'fra').then(({ data: { text } }) => {
            // Cherche les codes AR... et CO...
            const arMatch = text.match(/AR[A-Z0-9]+/i);
            const coMatch = text.match(/CO[A-Z0-9]+/i);
            
            if (arMatch) document.getElementById('bc').value = arMatch[0].toUpperCase();
            if (coMatch) document.getElementById('co').value = coMatch[0].toUpperCase();
            
            status.innerText = "Scan terminé !";
        });
    });
</script>
</body>
</html>
